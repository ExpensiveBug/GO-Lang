{{ define "title" }} Home {{ end }}

{{ define "content" }}

<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <section class="lg:col-span-2">
        <h1 class="text-3xl font-bold mb-8 text-white">Latest Posts</h1>
        <!-- loop over post -->
        {{ range . }} 
        <a href="/post?id={{ .ID }}" class="block"> 
            <article class="bg-gray-800 rounded-xl shadow-md p-6 mb-6 transition-colors duration-300"> 
                <h2 class="text-2xl font-bold mb-2 text-white"> {{ .Title }} </h2>  
                <p class="text-sm text-gray-400 mb-4"> {{ .Category }} </p>  
                <p class="text-gray-300 mb-4"> {{ .Content }} </p> 
                <p class="text-sm text-gray-500"> By {{ .Author }} </p> 
                <p class="text-sm text-gray-500 mt-1"> {{ .CreatedAt }} </p> 
            </article> 
        </a>

        {{ else }} 
        <div class="bg-gray-800 rounded-xl shadow-md p-6"> 
            <p class="text-gray-300 text-center"> No posts available yet. </p> 
        </div> 
        {{ end }} 
    </section>
    
</div>

{{ end }}
