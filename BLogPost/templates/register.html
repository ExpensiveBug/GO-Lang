{{ define "title" }} Register User {{ end }}
{{ define "content" }}
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold mb-2">Create Your Account</h1>
        <p class="text-gray-600 dark:text-gray-400">Join MyBlog and start sharing your ideas</p>
      </div>

      <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8">
        <form action="/register" method="POST">
          <div class="mb-5">
            <label for="name" class="block font-medium mb-2">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required
              class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div class="mb-5">
            <label for="email" class="block font-medium mb-2">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required
              class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div class="mb-6">
            <label for="password" class="block font-medium mb-2">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required
              class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition">Create Account</button>
        </form>

        <div class="text-center mt-6">
          <p class="text-gray-600 dark:text-gray-400">
            Already have an account?
            <a href="/login" class="text-blue-600 dark:text-blue-400 font-medium hover:underline">Login</a>
          </p>
        </div>
      </div>
    </div>

{{ end }}
