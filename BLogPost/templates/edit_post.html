{{ define "title" }}Edit Post{{ end }}

{{ define "content" }}

<div class="bg-white border border-gray-200 rounded-xl p-8">
    <h1 class="text-3xl font-bold mb-8">Edit Post</h1>
    <form action="/edit_post?id={{ .ID }}" method="POST" class="space-y-6">
        <div>
            <label class="block font-medium mb-2">Title</label>
            <input type="text" name="title" value="{{ .Title }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block font-medium mb-2">Category</label>
            <input type="text" name="category" value="{{ .Category }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"> 
        </div>

        <div>
            <label class="block font-medium mb-2">Content</label>
            <textarea name="content" rows="12" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">{{ .Content }}</textarea>
        </div>

        <div class="flex gap-4">
            <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700"> Save Changes </button>
            <a href="/post?id={{ .ID }}" class="px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-100"> Cancel </a>
        </div>
    </form>
</div>

{{ end }}
