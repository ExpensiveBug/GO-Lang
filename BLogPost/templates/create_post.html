{{ define "title" }} Create Post {{ end }}

{{ define "content" }}

<div class="max-w-3xl mx-auto">
    <div class="light:bg-white bg-gray-600 border border-gray-200 dark:border-gray-700 rounded-xl p-8 shadow-lg">
        <h1 class="text-3xl font-bold mb-8"> Create New Post </h1>

        <form action="/create_post" method="POST" class="space-y-6">
            <div>
                <label for="title" class="block font-medium mb-2" > Title </label>
                <input type="text" id="title" name="title" placeholder="Enter your post title" required class="w-full px-4 py-3 border light:border-gray-300 border-gray-600
                           rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div> 
                <label for="author" class="block font-medium mb-2" > Author </label>
                <input type="text" id="author" name="author" placeholder="Enter author's name" required class="w-full px-4 py-3 border light:border-gray-300 border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500" > 
            </div>

            <div>
                <label for="category" class="block font-medium mb-2" > Category </label>
                <input type="text" id="category" name="category" placeholder="Example: Go" required class="w-full px-4 py-3 border light:border-gray-300 border-gray-600
                           rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label for="content" class="block font-medium mb-2" > Content </label>

                <textarea id="content" name="content" rows="12" placeholder="Write your blog post here..." required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 :ring-blue-500"
                ></textarea>
            </div>

            <div class="flex items-center gap-4">
                <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition" > Publish Post </button>
                <a href="/" class="px-6 py-3 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition" > Cancel </a>
            </div>
        </form>
    </div>
</div>

{{ end }}
