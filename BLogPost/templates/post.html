{{ define "title" }}{{ .Title }}{{ end }}

{{ define "content" }}

<main class="max-w-4xl mx-auto px-6 py-12">
    <article class="bg-gray-800 border border-gray-700 rounded-xl p-8 md:p-12">
        <h1 class="text-4xl text-white font-bold leading-tight mb-5">{{ .Title }}</h1>
        <div class="flex gap-5 text-sm text-gray-400 border-b border-gray-700 pb-6">
            <span>{{ .CreatedAt }}</span>
            <span>By {{ .Author }}</span>
        </div>

        <div class="mt-8 text-white leading-8 whitespace-pre-line">{{ .Content }}</div>
        <div class="mt-10 pt-6 border-t border-gray-700">
            <a href="/" class="text-blue-500 font-medium :text-blue-400"> Back to posts </a>
            <a href="/edit_post?id={{ .ID }}" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-500">
                Edit Post
            </a>
           <form action="/delete_post?id={{ .ID }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this post?');">
                <button type="submit" class="px-4 py-2 rounded-lg bg-red-600 text-white font-medium hover:bg-red-500">Delete Post</button>
            </form>
        </div>
    </article>
</main>

{{ end }}
