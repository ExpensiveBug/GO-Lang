{{ define "base" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {{ block "title" . }} My BLogs {{ end }}</title>
    <script src = "https://cdn.tailwindcss.com"> </script>
</head>
<body class="bg-gray-800 ">
    <!-- nav bar -->
    <nav class="bg-gray-900">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center ">
            <a href="/" class ="text-2xl font-bold text-blue-400"> MyBLogs </a>
            <!-- navigation items -->
            <div class="flex items-center gap-6">
                <a href="/" class="text-gray-400 hover:text-blue-400">Home</a>
                <a href="/about" class="text-gray-400 hover:text-blue-400">About</a>
                <a href="/help" class ="text-gray-400 hover:text-blue-400">Help</a>
                <a href="/rules" class ="text-gray-400 hover:text-blue-400">Rules</a>

                <a href="/create_post" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">New Post</a>
            </div>
        </div>
    </nav>
    
    <main class = "max-w-7xl mx-auto px-6 py-10">
        {{ block "content" . }}
        
        {{ end }}
    </main>

    <footer class="bg-gray-800 border-t border-white mt-10 ">
        <div class="max-w-7xl mx-auto px-6 py-6 text-center">
            <p class = "text-gray-200 ">All rights reserved </p> 
        </div>
    </footer>
</body>
</html>

{{ end }}
